<!doctype html>
<html>
<head><meta charset="utf-8"><title>PU Exam Filler</title>
<style>body{font:14px Arial,sans-serif;min-width:260px;padding:14px}button{width:100%;padding:9px;margin-top:8px;border:0;border-radius:6px;cursor:pointer}#fill{background:#6c5ce7;color:white}#reload{background:#eee}.muted{font-size:12px;color:#666;margin-top:8px}</style>
</head>
<body>
<h3>PU Prompt Exam Filler</h3>
<label>Question number</label>
<input id="num" type="number" min="1" max="80" value="1" style="width:100%;box-sizing:border-box;padding:7px;margin-top:5px">
<button id="fill">Fill Current Question</button>
<button id="reload">Reload page</button>
<div id="status" class="muted">80 questions loaded from Excel.</div>
<script src="popup.js"></script>
</body></html>
